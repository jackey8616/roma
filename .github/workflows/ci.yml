name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run check:adr-enforcers

      - run: npm test

      - run: npm run build

      - name: dist is src alone, and runnable
        run: |
          if [ ! -f dist/channels/main.js ]; then
            echo 'dist/ has no entrypoint' >&2
            exit 1
          fi
          compiled_tests="$(find dist -name '*.test.js')"
          if [ -n "${compiled_tests}" ]; then
            echo 'the tests were compiled into dist/:' >&2
            echo "${compiled_tests}" >&2
            exit 1
          fi

  adr-numbers:
    name: no two ADRs take one number
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check:adr-collision
        env:
          ADR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: roma:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: ./scripts/verify-image.sh roma:ci
