name: release

# Tags only. Pushing `0.1.0` publishes exactly one image tag, `0.1.0` — no
# `latest`, no `0.1`, no `0`.
#
# `ghcr.io/…/roma:0` reads like a pin and is not one: a deployment that pulls it
# after a later release gets a different Claude Code than the one its evidence was
# gathered against, which is the same drift `@latest` was rejected for walking
# back in through the registry. `latest` is at least honest about being unpinned,
# but for a system whose behaviour is version-specific, `docker run` without a tag
# should fail rather than guess. ADR-0006 has the reasoning.
#
# Matched on the version shape, so a tag that is not a release — `v0.1.0`, a docs
# tag, an rc — starts nothing rather than starting a run that can only go red.
#
# This is a GitHub filter pattern and not a regular expression: `+` means one or
# more of the preceding character, and `.` is a literal dot. The cost of matching
# this tightly is that a misspelled tag is silent, so the shape is the only thing
# this line checks — a tag of the right shape carrying the wrong number is the
# assertion below's job, and that one refuses out loud.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build, verify, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # First, and before anything is built or pushed. A tag that disagrees with
      # the manifest publishes an image whose own `org.opencontainers.image.version`
      # contradicts the registry tag it arrived under, and there is no way to
      # take it back off GHCR afterwards.
      - name: the tag is the version in package.json
        id: version
        # Through the environment rather than interpolated into the script. A
        # refname may contain a single quote, so `tag='${{ github.ref_name }}'`
        # is a tag that can close the quote and run commands — and it would run
        # them *before* the check below had a chance to reject the name.
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="$(jq -r .version package.json)"
          if [ "${TAG}" != "${version}" ]; then
            echo "tag ${TAG} does not match package.json version ${version}" >&2
            exit 1
          fi
          repository="$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repository}:${TAG}" >> "${GITHUB_OUTPUT}"

      # A tag can be pushed at any commit, including one no pull request ever
      # checked. The suite is three seconds and it is the only place the literal
      # Claude Code version lives — `scripts/verify-image.sh` can only ask
      # whether the image contains what it declares, which is true of an image
      # whose pin was moved as well as one whose pin was not.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - uses: docker/setup-buildx-action@v3

      # Loaded rather than pushed, because it is verified before anybody can pull
      # it. `linux/amd64` alone, which is what makes a single-platform `load`
      # possible at all.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.version.outputs.image }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha

      - run: ./scripts/verify-image.sh "${IMAGE}"
        env:
          IMAGE: ${{ steps.version.outputs.image }}

      # Last, and the first irreversible step in this file.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR package visibility is not the repository's. After the first push the
      # package is private until somebody changes it by hand, and no workflow can
      # do that step.
      - run: |
          docker push "${IMAGE}"
          echo "Published ${IMAGE}" >> "${GITHUB_STEP_SUMMARY}"
        env:
          IMAGE: ${{ steps.version.outputs.image }}
