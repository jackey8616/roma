name: release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build, verify, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: the tag is the version in package.json
        id: version
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="$(jq -r .version package.json)"
          if [ "${TAG}" != "${version}" ]; then
            echo "tag ${TAG} does not match package.json version ${version}" >&2
            exit 1
          fi
          repository="$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repository}:${TAG}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.version.outputs.image }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha

      - run: ./scripts/verify-image.sh "${IMAGE}"
        env:
          IMAGE: ${{ steps.version.outputs.image }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          docker push "${IMAGE}"
          echo "Published ${IMAGE}" >> "${GITHUB_STEP_SUMMARY}"
        env:
          IMAGE: ${{ steps.version.outputs.image }}
